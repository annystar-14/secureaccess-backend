<VirtualHost *:80>
    ServerName DOMINIO_FRONTEND
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/secureaccess

    <Directory /var/www/secureaccess>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /api/ http://IP_PRIVADA_BACKEND:3000/api/
    ProxyPassReverse /api/ http://IP_PRIVADA_BACKEND:3000/api/

    ErrorLog ${APACHE_LOG_DIR}/secureaccess-error.log
    CustomLog ${APACHE_LOG_DIR}/secureaccess-access.log combined
</VirtualHost>
